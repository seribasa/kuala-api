codecov:
    require_ci_to_pass: true

coverage:
    precision: 2
    round: down
    range: "0...100"

    status:
        project:
            default:
                target: 80%
                threshold: 0%
                if_not_found: failure

        patch:
            default:
                target: 80%
                threshold: 0%
                if_not_found: failure
